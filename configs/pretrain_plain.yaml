project:
  name: pretrain-plain
  family: pathology-fairness-timing
  recipe_id: dinov2-vits14-reg-jepa-mask10
  output_dir: outputs/pretrain-plain
  wandb_dir: outputs/wandb
data:
  dataset_dir: data/pretraining_tiles
  exclude_barcodes_file: data/metadata/downstream_holdout.txt
  holdout_task: brca
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  color_jitter: 0.3
  color_jitter_saturation: 0.25
  hed_jitter: 0.07
  tissue_thresh: 0.0
model:
  type: dinov2_vits14_reg
train:
  seed: 2026
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000
  max_train_flops: 1000000000000000000
  log_every: 20
  save_every: 1000
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 112
  resume: null
dino:
  lr: 0.000125
  lr_min: 0.000001
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0
  jepa_pred_depth: 4
  jepa_pred_width: 0
  jepa_blocks: 4
  jepa_block_scale: 0.1
  freeze_backbone_fraction: 0.0
probe:
  enabled: false
  count: 0
  model_weights: ema
fino:
  enabled: false
