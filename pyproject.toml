[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-fairness-timing"
version = "0.1.0"
description = "Reusable objectives for matched fairness-intervention timing studies."
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
research = [
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  "pillow>=10",
  "pyarrow>=15",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torchvision>=0.17",
  "wandb>=0.17",
]
test = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
