[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-fairness-timing"
version = "0.1.0"
description = "Reusable objectives for matched fairness-intervention timing studies."
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
